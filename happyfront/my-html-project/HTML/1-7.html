<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dl, dt, dd 요소</title>
    <style>
      /* 기본 dd 들여쓰기 제거 */
      dd {
        margin-left: 40px; /* 기본 상태 유지 */
      }

      /* 특정 항목만 왼쪽 정렬 */
      .left {
        margin-left: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>경상도의 광역시</h1>
      <dl>
        <dt>경상북도의 광역시</dt>
        <dd class="left">대구광역시</dd>

        <dt>경상남도의 광역시</dt>
        <dd>울산광역시</dd>
        <dd>부산광역시</dd>
      </dl>
    </div>
  </body>
</html>
