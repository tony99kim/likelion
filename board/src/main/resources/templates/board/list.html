<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 class="page-title">게시판 목록</h1>

    <p class="message" th:if="${message}" th:text="${message}"></p>

    <table class="board-table">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boards}">
            <td th:text="${board.displayNumber}">번호</td>
            <td>
                <a th:href="@{/view(id=${board.id})}" th:text="${board.title}">제목</a>
            </td>
            <td th:text="${board.name}">작성자</td>
            <td th:text="${board.createdAt}">작성일</td>
        </tr>
        </tbody>
    </table>

    <div class="action-area">
        <a class="btn" th:href="@{/writeform}">새 글 작성</a>
    </div>
</div>
</body>
</html>
