<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 class="page-title">게시글 수정</h1>

    <p class="error-message"  th:text="${errorMessage}"></p>

    <form th:action="@{/update}" th:object="${board}" method="post">
        <input type="hidden" name="id" th:value="${boardId}">

        <div class="form-group">
            <label>이름</label>
            <input class="form-control" type="text" th:field="*{name}" placeholder="작성자 이름을 입력하세요">
            <span class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">이름 오류</span>
        </div>

        <div class="form-group">
            <label>제목</label>
            <input class="form-control" type="text" th:field="*{title}" placeholder="제목을 입력하세요">
            <span class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">제목 오류</span>
        </div>

        <div class="form-group">
            <label>암호</label>
            <input class="form-control" type="password" th:field="*{password}" placeholder="게시글 암호를 입력하세요">
            <span class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">암호 오류</span>
        </div>

        <div class="form-group">
            <label>내용</label>
            <textarea class="form-control" th:field="*{content}" placeholder="내용을 입력하세요"></textarea>
            <span class="error-message" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">내용 오류</span>
        </div>

        <div class="action-area">
            <button class="btn" type="submit">수정</button>
            <a class="btn btn-secondary" th:href="@{/view(id=${boardId})}">취소</a>
        </div>
    </form>
</div>
</body>
</html>
